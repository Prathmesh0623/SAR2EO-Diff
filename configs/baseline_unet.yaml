# Config for the U-Net baseline (Stage 6)
experiment_name: "unet_baseline_v1"
model: "unet"

data:
  dataset_root: "/kaggle/input/datasets/krishnaanchal/sen12ms-asia/asian_sen12ms_shards"
  patch_size: 256          # was 128 -- this dataset's patches are already 256x256, no cropping needed
  # (remove or ignore sar_channels / eo_channels -- ShardedSEN12MSDataset doesn't use them,
  #  it always returns the 3-channel sar/opt tensors as stored)

model_params:
  in_channels: 3            # was 2 -- this dataset's SAR has 3 channels, not VV/VH only

training:
  batch_size: 4              # start conservative -- 256x256 uses more memory than the 128 I assumed
  epochs: 2                    # smoke test only -- bump this up later for a real run

logging:
  use_wandb: true
  project: "sar2eo-diff"
  run_name: "unet-baseline"

seed: 42
