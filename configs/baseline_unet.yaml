# Config for the U-Net baseline (Stage 6)
experiment_name: "unet_baseline_v1"
model: "unet"

data:
  dataset_root: "/kaggle/input/datasets/krishnaanchal/sen12ms-asia/asian_sen12ms_shards"
  patch_size: 256          # this dataset's patches are already 256x256, no cropping needed
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  seed: 42

model_params:
  in_channels: 3            # this dataset's SAR has 3 channels, not VV/VH only
  out_channels: 3
  base_channels: 64
  depth: 4

training:
  batch_size: 4              # start conservative -- 256x256 uses more memory than 128 would
  learning_rate: 0.0001
  optimizer: "adam"
  epochs: 20                    # smoke test only -- bump this up later for a real run
  loss: "l1"
  mixed_precision: true
  grad_accum_steps: 1
  num_workers: 2
  checkpoint_dir: "checkpoints/unet"
  save_every_n_epochs: 1
  resume_from: null

logging:
  use_wandb: false
  project: "sar2eo-diff"
  run_name: "unet-baseline"

seed: 42