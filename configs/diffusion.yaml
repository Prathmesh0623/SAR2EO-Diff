# Config for conditional diffusion model (Stage 8) + semantic consistency (Stage 9)
experiment_name: "conditional_diffusion_v1"
model: "diffusion"

data:
  dataset_root: "/kaggle/input/sen12ms"
  sar_channels: ["VV", "VH"]
  eo_channels: ["R", "G", "B"]
  patch_size: 128
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  seed: 42

model_params:
  in_channels: 3          # noisy EO (3) concatenated with SAR conditioning
  cond_channels: 2         # SAR VV+VH
  out_channels: 3
  base_channels: 64
  channel_mults: [1, 2, 2, 4]
  num_res_blocks: 2
  timesteps: 1000
  beta_schedule: "linear"

semantic_consistency:
  enabled: false           # set true after Stage 9 is implemented and validated
  segmentation_ckpt: null
  lambda_semantic: 0.1

training:
  batch_size: 4            # diffusion is memory-heavy; start small
  learning_rate: 0.0002
  optimizer: "adamw"
  epochs: 50
  mixed_precision: true
  grad_accum_steps: 4
  num_workers: 2
  checkpoint_dir: "checkpoints/diffusion"
  save_every_n_epochs: 1
  resume_from: null
  ema_decay: 0.995

sampling:
  num_inference_steps: 250  # DDIM-style reduced sampling for speed
  guidance_scale: 1.0

logging:
  use_wandb: true
  project: "sar2eo-diff"
  run_name: "conditional-diffusion"

seed: 42
